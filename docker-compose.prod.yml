services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - ML_SERVICE_URL=http://ml:8001
    depends_on:
      - ml
    restart: unless-stopped

  ml:
    build:
      context: ./apps/ml
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    restart: unless-stopped
